[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mazmorra"
version = "0.3.0"
description = "Gestor de mazmorras para juegos de rol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["mazmorra*"]

[tool.pytest.ini_options]
addopts = "--cov=mazmorra --cov-report=term-missing"